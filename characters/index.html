<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D&D 5e Level-Up Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
:root{
  /* D&D parchment + crimson & gold theme */
  --bg:#2a1d16; /* deep brown backdrop */
  --paper:#f1e6cf; /* parchment */
  --paper-ink:#24180f; /* dark sepia text */
  --ink:#24180f; /* main text color */
  --muted:#6e5a47; /* muted labels */
  --accent:#7a0e0e; /* deep crimson */
  --accent-2:#c19a2b; /* antique gold */
  --edge:#b0892f; /* gold edge */
  --panel:#efe4ca; /* light parchment panels */
  --ring: 0 0 0 2px rgba(193,154,43,.35);
  }
  html,body{margin:0;min-height:100%;
  background:
  radial-gradient(1200px 600px at 60% -20%, rgba(122,14,14,.15), transparent),
  linear-gradient(0deg, rgba(0,0,0,.35), rgba(0,0,0,.35)),
  url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 40 40%22><filter id=%22n%22><feTurbulence baseFrequency=%220.9%22 numOctaves=%222%22 seed=%229%22 type=%22fractalNoise%22/></filter><rect width=%2240%22 height=%2240%22 filter=%22url(%23n)%22 opacity=%220.05%22/></svg>'),
  var(--bg);
  color:var(--ink);
  font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;}
  .wrap{max-width:1100px;margin:40px auto;padding:0 20px;}
  body{margin:0;background:radial-gradient(1200px 600px at 60% -20%, rgba(124,156,255,.07), transparent),
  radial-gradient(800px 400px at 10% 120%, rgba(167,255,221,.06), transparent),
  var(--bg);color:var(--ink);font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";}
  .wrap{max-width:1100px;margin:40px auto;padding:0 20px;}
  .card{background:
  linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.4)),
  radial-gradient(800px 400px at 20% 0%, rgba(193,154,43,.18), transparent),
  var(--paper);
  color:var(--paper-ink);
  border:2px solid var(--edge);
  border-radius:18px;box-shadow:0 20px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.08);}
  .hdr{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:18px 18px;border-bottom:3px double var(--edge);background:linear-gradient(180deg, rgba(193,154,43,.08), transparent);}
  .title{font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);
  background:linear-gradient(90deg, var(--accent-2), #e8cf7e, var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 1px 0 #fff4, 0 0 24px rgba(193,154,43,.25);}
  .controls{display:flex;gap:10px;flex-wrap:wrap}
  .select, .btn, .level{appearance:none;background:var(--panel);border:1px solid rgba(36,24,15,.2);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
  .select:focus, .btn:focus{outline:none;box-shadow:var(--ring)}
  .btn{cursor:pointer;display:inline-flex;gap:8px;align-items:center;background:linear-gradient(180deg,#7a0e0e,#580a0a);color:#f7ead0;border:1px solid #360606;border-radius:10px;padding:10px 14px;box-shadow:0 2px 0 #360606, 0 6px 14px rgba(0,0,0,.25);}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .grid{display:grid;grid-template-columns: 1.2fr 1fr;gap:18px;padding:18px;background:linear-gradient(180deg, rgba(193,154,43,.06), transparent);}
  .panel{background:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.4)), var(--panel);border:1px solid rgba(36,24,15,.25);border-radius:12px;padding:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);}
  .panel h3{margin:.2rem 0 .8rem;font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:8px;row-gap:10px;font-size:14px}
  .kv div.key{color:var(--muted)}
  .features{display:grid;gap:10px}
  .feat{padding:12px;border:1px solid rgba(36,24,15,.2);border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.35));}
  .feat h4{margin:0 0 6px;font-size:14px;color:var(--accent-2);text-shadow:0 1px 0 #fff8;}
  .foot{display:flex;justify-content:space-between;align-items:center;border-top:3px double var(--edge);padding:12px 18px;color:var(--muted);font-size:13px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tab{padding:8px 10px;border-radius:999px;border:1px solid rgba(36,24,15,.25);background:linear-gradient(180deg, #f6edd8, #e8dcc3);font-size:12px;cursor:pointer;color:var(--ink);}
  .tab.active{border-color:var(--edge);box-shadow: 0 0 0 2px rgba(193,154,43,.25) inset, 0 0 0 1px rgba(193,154,43,.45);}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width: 900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="region" aria-label="D&D 5e Level-Up Guide">
      <div class="hdr">
        <div class="title">D&D 5e Level‑Up Guide</div>
        <div class="controls">
          <label>
            <span class="sr">Class</span>
            <select id="classSelect" class="select" aria-label="Select class"></select>
          </label>
          <label>
            <span class="sr">Level</span>
            <select id="levelSelect" class="select" aria-label="Select level"></select>
          </label>
          <button id="prevBtn" class="btn" aria-label="Previous level">◀ Prev</button>
          <button id="nextBtn" class="btn" aria-label="Next level">Next ▶</button>
        </div>
      </div>

      <div class="grid">
        <section class="panel" aria-live="polite" aria-atomic="true">
          <h3 id="pageTitle">Class & Level</h3>
          <div class="kv" id="summaryKV"></div>
          <div class="tabs" id="subtabs" role="tablist" aria-label="Sections">
            <!-- Populated: Features / Proficiencies / Spells / Notes -->
          </div>
        </section>
        <section class="panel">
          <h3 id="sectionTitle">Features</h3>
          <div id="sectionBody" class="features"></div>
        </section>
      </div>

      <div class="foot">
        <div id="footInfo">Use ← / → to flip pages</div>
        <div id="shareLink"></div>
      </div>
    </div>
  </div>

  <script>
// === CONFIG ===
const DATA_JSON_PATH = '/characters/dnd5e_srd_classes.json'; // <-- or './dnd5e_srd_classes.json' if page is under /characters/

// Tiny fallback so UI still works if JSON can't load
const DEFAULT_CLASSES = {
  Fighter: {
    hitDie: 'd10',
    primary: ['Strength or Dexterity'],
    saves: ['Strength','Constitution'],
    armor: ['All armor','Shields'],
    weapons: ['Simple','Martial'],
    levels: {
      1: { proficiencyBonus:'+2', features:[{name:'Fighting Style',text:'Choose a style.'},{name:'Second Wind',text:'Regain 1d10+level HP once per rest.'}], proficiencies:[], spells:[], notes:'Fallback data' },
      2: { proficiencyBonus:'+2', features:[{name:'Action Surge',text:'One extra action once per rest.'}], proficiencies:[], spells:[], notes:'' },
      3: { proficiencyBonus:'+2', features:[{name:'Martial Archetype',text:'Pick a subclass.'}], proficiencies:[], spells:[], notes:'' }
    }
  }
};

let CLASSES = {};

async function loadClasses(){
  try{
    const res = await fetch(DATA_JSON_PATH, { cache: 'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return (data && data.classes && typeof data.classes === 'object') ? data.classes : DEFAULT_CLASSES;
  }catch(e){
    console.error('Failed to load classes JSON:', e);
    return DEFAULT_CLASSES;
  }
}

/* ======= UTILITIES ======= */
const clamp = (n,min,max)=> Math.max(min, Math.min(max, n));
function classesList(){ return Object.keys(CLASSES || {}); }
function maxLevelFor(cls){
  const levels = (CLASSES && CLASSES[cls] && CLASSES[cls].levels) ? CLASSES[cls].levels : {1:{}};
  return Math.max(...Object.keys(levels).map(Number));
}

function setHash(cls, lvl){
  const enc = encodeURIComponent;
  const hash = `#class=${enc(cls)}&level=${enc(lvl)}`;
  history.replaceState(null, '', hash);
  document.getElementById('shareLink').innerHTML =
    `<a href="${hash}" style="color:var(--accent);text-decoration:none">Link to ${cls} ${lvl}</a>`;
}

function parseHash(){
  const params = new URLSearchParams(location.hash.slice(1));
  let cls = params.get('class') || '';
  let lvl = parseInt(params.get('level') || '1', 10);
  const list = classesList();
  if (!list.length) return { cls:'', lvl:1 };
  if (!CLASSES[cls]) cls = list[0];
  if (!Number.isFinite(lvl)) lvl = 1;
  const keys = Object.keys((CLASSES[cls] && CLASSES[cls].levels) || {1:{}}).map(Number).sort((a,b)=>a-b);
  const minL = keys[0] || 1, maxL = keys[keys.length-1] || 1;
  lvl = Math.min(Math.max(lvl, minL), maxL);
  return { cls, lvl };
}

/* ======= RENDERING ======= */
function renderClassOptions(){
  const sel = document.getElementById('classSelect');
  sel.innerHTML = classesList().map(c=>`<option value="${c}">${c}</option>`).join('');
}
function renderLevelOptions(cls){
  const sel = document.getElementById('levelSelect');
  const Ls = (CLASSES[cls] && CLASSES[cls].levels) ? CLASSES[cls].levels : {1:{}};
  const levels = Object.keys(Ls).map(Number).sort((a,b)=>a-b);
  sel.innerHTML = levels.map(l=>`<option value="${l}">Level ${l}</option>`).join('');
}
function renderSummary(cls, lvl){
  const info = CLASSES[cls];
  const L = info.levels[lvl];
  const kv = document.getElementById('summaryKV');
  document.getElementById('pageTitle').textContent = `${cls} — Level ${lvl}`;
  kv.innerHTML = `
    <div class="key">Hit Die</div><div>${info.hitDie}</div>
    <div class="key">Primary</div><div>${info.primary.join(', ')}</div>
    <div class="key">Saving Throws</div><div>${info.saves.join(', ')}</div>
    <div class="key">Weapons</div><div>${info.weapons.join(', ')}</div>
    <div class="key">Armor</div><div>${info.armor.join(', ')}</div>
    <div class="key">Prof. Bonus</div><div>${L.proficiencyBonus}</div>
  `;
  const tabs = [
    { id:'features', label:'Features', count: L.features?.length || 0 },
    { id:'profs', label:'Proficiencies', count: L.proficiencies?.length || 0 },
    { id:'spells', label:'Spells', count: L.spells?.length || 0 },
    { id:'notes', label:'Notes', count: L.notes ? 1 : 0 }
  ];
  const tabEl = document.getElementById('subtabs');
  tabEl.innerHTML = tabs.map((t,i)=>`<button role="tab" class="tab ${i===0?'active':''}" data-tab="${t.id}">${t.label}${t.count?` (${t.count})`:''}</button>`).join('');
  renderSection(cls, lvl, 'features');
}
function renderSection(cls, lvl, which){
  const info = CLASSES[cls];
  const L = info.levels[lvl];
  const title = document.getElementById('sectionTitle');
  const body = document.getElementById('sectionBody');
  document.querySelectorAll('#subtabs .tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===which));
  if(which==='features'){
    title.textContent = 'Features'; body.className = 'features';
    body.innerHTML = (L.features||[]).map(f=>`
      <article class="feat"><h4>${f.name}</h4><div>${f.text}</div></article>
    `).join('') || `<div class="muted">No features listed for this level.</div>`;
  } else if(which==='profs'){
    title.textContent = 'Proficiencies Gained'; body.className = 'features';
    body.innerHTML = (L.proficiencies||[]).map(p=>`<div class="feat">${p}</div>`).join('') || `<div class="muted">No new proficiencies at this level.</div>`;
  } else if(which==='spells'){
    title.textContent = 'Spells / Slots'; body.className = 'features';
    body.innerHTML = (L.spells||[]).map(s=>`<div class="feat">${s}</div>`).join('') || `<div class="muted">No spell updates recorded for this level.</div>`;
  } else if(which==='notes'){
    title.textContent = 'Notes'; body.className = 'features';
    body.innerHTML = L.notes ? `<div class="feat">${L.notes}</div>` : `<div class="muted">No notes.</div>`;
  }
}
function goTo(cls, lvl){
  const list = classesList(); if (!list.length) return;
  if (!CLASSES[cls]) cls = list[0];
  const maxLvl = maxLevelFor(cls);
  lvl = clamp(lvl, 1, maxLvl);
  document.getElementById('classSelect').value = cls;
  renderLevelOptions(cls);
  document.getElementById('levelSelect').value = String(lvl);
  renderSummary(cls, lvl);
  setHash(cls, lvl);
  updateNavButtons(cls, lvl);
}
function updateNavButtons(cls, lvl){
  const maxLvl = maxLevelFor(cls);
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  prev.disabled = lvl<=1; next.disabled = lvl>=maxLvl;
  document.getElementById('footInfo').textContent = `${cls} • Level ${lvl} of ${maxLvl}`;
}

/* ======= EVENTS ======= */
document.addEventListener('click', (e)=>{
  const t = e.target;
  if(t.matches('#prevBtn')){ const cls = classSelect.value; const lvl = parseInt(levelSelect.value,10)-1; goTo(cls, lvl); }
  if(t.matches('#nextBtn')){ const cls = classSelect.value; const lvl = parseInt(levelSelect.value,10)+1; goTo(cls, lvl); }
  if(t.matches('#subtabs .tab')){ const which = t.dataset.tab; const cls = classSelect.value; const lvl = parseInt(levelSelect.value,10); renderSection(cls, lvl, which); }
});
document.addEventListener('change', (e)=>{
  if(e.target.matches('#classSelect')) goTo(e.target.value, 1);
  if(e.target.matches('#levelSelect')){ const cls = classSelect.value; goTo(cls, parseInt(e.target.value,10)); }
});
document.addEventListener('keydown', (e)=>{
  if(['ArrowLeft','ArrowRight'].includes(e.key)){
    const cls = classSelect.value; const lvl = parseInt(levelSelect.value,10);
    goTo(cls, e.key==='ArrowLeft' ? lvl-1 : lvl+1);
  }
});
window.addEventListener('hashchange', ()=>{ const {cls, lvl} = parseHash(); goTo(cls, lvl); });

/* ======= INIT ======= */
(async function init(){
  CLASSES = await loadClasses();
  const list = classesList();
  if(!list.length){
    document.getElementById('sectionBody').innerHTML = '<div class="feat">Failed to load class data.</div>';
    return;
  }
  renderClassOptions();
  const {cls, lvl} = parseHash();
  const chosen = (cls && CLASSES[cls]) ? cls : list[0];
  goTo(chosen, Number.isFinite(lvl) ? lvl : 1);
})();
</script>

</body>
</html>
